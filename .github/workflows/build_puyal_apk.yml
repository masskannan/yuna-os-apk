name: Build YUNA Polyglot Sovereign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept SDK Licenses & Install NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
      - name: Setup Rust (arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Cargo NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-ndk-v1
      - name: Run Rust Tests & Build Rust Brain (.so)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          cargo test --manifest-path wasm_modules/rust_brain/Cargo.toml
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          (cd wasm_modules/rust_brain && cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release)
      - name: Setup Zig 0.13.0 & Build Zig Hands (.so)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Compile Zig (.so)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          zig build-lib wasm_modules/zig_hands/src/main.zig -target aarch64-linux-android -dynamic -O ReleaseSmall -femit-bin=app/src/main/jniLibs/arm64-v8a/libyuna_zig.so
      - name: Setup Gradle 8.7 (for AGP 8.5.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Unit Tests & Build Debug + Release APKs (<= 100MB Gate)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --continue
          else
            gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon --continue
          fi
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > app/build/outputs/apk/SHA256SUMS.txt
          cat app/build/outputs/apk/SHA256SUMS.txt
      - name: Upload Production APKs & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: yuna-polyglot-production-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS.txt
