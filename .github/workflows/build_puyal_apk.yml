name: Build Puyal Sovereign OS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-sovereign-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PuyalSovereignOS
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust Wasm Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile Rust Micro-Brain (.wasm)
        run: |
          cd wasm_modules/rust_brain
          cargo build --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/rust_brain.wasm ../../app/src/main/assets/wasm/

      - name: Build <20MB Release/Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || gradle wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Puyal Sovereign OS APK
        uses: actions/upload-artifact@v4
        with:
          name: PuyalSovereignOS-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
