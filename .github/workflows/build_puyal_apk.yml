name: Build YUNA Polyglot Sovereign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept SDK Licenses & Install NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
      - name: Setup Rust (arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Cargo NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-ndk-v1
      - name: Build Rust Brain (.so)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --manifest-path wasm_modules/rust_brain/Cargo.toml --release
      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build Zig Hands (.so)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          zig build-lib wasm_modules/zig_hands/src/main.zig -target aarch64-linux-android -dynamic -O ReleaseSmall -femit-bin=app/src/main/jniLibs/arm64-v8a/libyuna_zig.so
      - name: Build Debug & Minified Release APK + Size Check
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: yuna-polyglot-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
