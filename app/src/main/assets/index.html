<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YUNA</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/settings.css">
<link rel="stylesheet" href="css/pages/live.css">
<link rel="stylesheet" href="css/pages/history.css">
<link rel="stylesheet" href="css/pages/pages.css">
</head>
<body>
<div id="app">
 <header>
  <button id="bMenu" aria-label="menu">☰</button><h1>YUNA</h1>
  <button id="bLive" aria-label="live">◉</button><button id="bMore" aria-label="more">⋯</button>
 </header>
 <div id="findBar"><input id="findQ" type="search" data-ph="search" autocomplete="off"><span id="findN"></span><button id="findUp" aria-label="prev">▲</button><button id="findDn" aria-label="next">▼</button><button id="findX" aria-label="close">✕</button></div>
 <div id="chat"><div id="hello"><b data-i="hello"></b><span data-i="helloSub"></span></div></div>
</div>

<div class="dock-wrap"><div class="dock" id="dock">
 <textarea id="inp" rows="1" data-ph="ph" autocomplete="off"></textarea>
 <div class="drow">
  <button id="attach" class="g" aria-label="attach">＋</button>
  <button class="ctl g" id="bX" aria-label="clear">✕</button>
  <div id="wave"></div><span class="sp"></span>
  <button id="mic" class="g" aria-label="mic">🎙</button>
  <button class="ctl g" id="bStop" aria-label="stop">■</button>
  <button id="send" aria-label="send">↑</button>
 </div></div></div>

<div id="scrim"></div>
<aside id="drawer">
 <a data-go="projects"><b>▦</b><span data-i="projects"></span></a><a data-go="code"><b>⌘</b><span data-i="code"></span></a>
 <a data-go="creations"><b>✦</b><span data-i="creations"></span></a><a data-go="memory"><b>◈</b><span data-i="memory"></span></a>
 <h4 data-i="history"></h4><a id="histAll"><b>☰</b><span data-i="all"></span></a><div id="hist"></div>
</aside>
<div class="menu" id="moreMenu"><button id="mNew" data-i="newChat"></button><button id="mSet"><span data-i="settings"></span></button><button id="mPerm" data-i="perms"></button><button id="mFind"></button><button id="mShare"></button></div>

<div class="sheet" id="attachSheet"><div class="tiles">
 <button data-a="img"><b>▣</b><span data-i="aImg"></span></button><button data-a="cam"><b>◉</b><span data-i="aCam"></span></button>
 <button data-a="voice"><b>♪</b><span data-i="aVoice"></span></button><button data-a="file"><b>▤</b><span data-i="aFile"></span></button></div></div>
<input type="file" id="fileIn" accept="image/*,application/pdf" hidden>

<section class="page" id="historyPage"><div class="pg-inner">
 <div class="row"><button data-back aria-label="back">←</button><b data-i="history"></b><span></span></div>
 <input id="histQ" type="search" data-ph="search" autocomplete="off"><div id="histList"></div></div></section>

<div id="toast"></div>

<div id="live"><div id="liveTopBanner"><button id="bMin" aria-label="min">⌄</button><span id="glPillText"></span><span id="liveTime">0:00</span></div>
 <div class="orb-stage" id="orbStage"><div class="orb-aura"></div><div class="orb-water-ripple"></div>
 <div class="orb-core-clip"><img class="orb-img" alt="" src="assets/images/orb.webp"></div>
 <svg class="hud-svg" id="yunaTamilOrbSvg" viewBox="0 0 320 320" aria-hidden="true"></svg></div>
 <div id="orbSub"></div><div id="liveStateLabel" hidden></div><div id="yunaUyirMei" aria-hidden="true"></div>
 <div id="liveTranscriptBox"><div class="lt-u"></div><div class="lt-y"></div></div>
 <div id="typeSheet"><input id="typeIn" data-ph="ph" enterkeyhint="send"></div>
 <div id="liveBar"><button id="lMute">🎙</button><button id="lType">⌨</button><button class="end" id="lEnd">✕</button></div>
</div>
<button id="liveMiniPill"></button>


<script src="js/bridge.js"></script>
<script src="js/state.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/md.js"></script>
<script src="js/core/outputs.js"></script>
<script src="js/components/toast.js"></script>
<script src="js/components/dock.js"></script>
<script src="js/components/attach.js"></script>
<script src="js/pages/chat.js"></script>
<script src="js/pages/voice.js"></script>
<script src="js/router.js"></script>
<script src="js/components/orb.js"></script>
<script src="js/pages/live.js"></script>
<script src="js/pages/history.js"></script>
<script src="js/pages/find.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/safety.js"></script>
<script src="js/pages/tools.js"></script>
<script src="js/pages/workspace.js"></script>
<script src="js/pages/diag.js"></script>
<script src="js/app.js"></script>
</body></html>
